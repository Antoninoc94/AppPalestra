services:
  postgres:
    image: postgres:16-alpine
    container_name: apppalestra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: palestra
      POSTGRES_PASSWORD: palestra123
      POSTGRES_DB: apppalestra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palestra -d apppalestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://palestra:palestra123@postgres:5432/apppalestra
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: apppalestra-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://palestra:palestra123@postgres:5432/apppalestra
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
