  <rect x="142" y="12" width="18" height="48" rx="4" fill="#E8FF00"/>

  <!-- IRON -->
  <text x="178" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="white" dominant-baseline="auto">IRON</text>
  <!-- TRAINING -->
  <text x="180" y="64" font-family="Arial, sans-serif" font-weight="400" font-size="13" letter-spacing="5" fill="#E8FF00">TRAINING</text>
