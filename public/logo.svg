  <!-- Left collar -->
  <rect x="22" y="22" width="12" height="28" rx="3" fill="#E8FF00"/>
  <!-- Bar -->
  <rect x="34" y="30" width="96" height="12" rx="6" fill="#B0B8C0"/>
  <!-- Right collar -->
